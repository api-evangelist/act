method: searched
source: >-
  https://www.act.com/obsolescence-policy/ (Support Obsolescence Policy),
  https://status.act.com/ and https://status.act.com/api/v2/summary.json
  (Statuspage), https://www.act.com/products/whats-new/ (dated release notes),
  https://apimta.act.com/act.web.api/api/system (anonymous version route, probed
  2026-08-13), https://apimta.act.com/act.web.api/ and
  https://www.act.com/uploads/docs/en/webapi_admin_guide.pdf.
description: >-
  Act! versions the PRODUCT, not the API. There is no version segment in the
  Web API URL, no version request header, and no per-version API deprecation
  notice. What Act! does publish is a Support Obsolescence Policy that dates the
  end of support for each Act! release, and because the Web API ships inside
  Act! Premium for Web, that policy is the effective API deprecation calendar.

versioning:
  scheme: build-number (product release)
  mechanism: >-
    None in the request. The deployed build is discovered at runtime via the
    anonymous route GET /api/system, which returns apiVersion (the Web API
    build) and sdkVersion (the Act! SDK build).
  url_version_segment: false
  version_header: false
  observed:
    url: https://apimta.act.com/act.web.api/api/system
    http_status: 200
    fetched: '2026-08-13'
    apiVersion: 1.1.1324.1
    sdkVersion: 25.101.0.0
  note: >-
    Because most Act! Web API installs are self-hosted on the customer's own IIS
    server, two Act! customers can expose materially different builds of "the
    same" API. An integration should call GET /api/system before assuming an
    operation exists rather than assuming a single global version.

deprecation:
  policy_url: https://www.act.com/obsolescence-policy/
  policy_name: Act! Support Obsolescence Policy
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  scope: >-
    Product releases, applied to North America, South America and Australia /
    New Zealand, with separate regional policies published for France and
    Belgium; the UK, Ireland, South Africa and all other regions; and Germany,
    Austria and Switzerland.
  terms: >-
    The current version receives all feature enhancements, service packs,
    hotfixes, security improvements and compatibility updates. Other supported
    versions receive these only to address issues potentially resulting in data
    loss or data corruption due to product defect. Unsupported versions receive
    no updates, no security improvements and are not eligible for technical
    support. An active subscription is required for technical support on a
    supported version.
  schedule:
    - release: Act! Premium v26
      supported_through: '2026-11-30'
    - release: Act! Premium v25, Act! Growth Suite v25
      supported_through: '2025-11-30'
    - release: Act! Premium v24, Act! Growth Suite v24
      supported_through: '2024-08-31'
    - release: Act! Pro v24 (North America only)
      supported_through: '2024-08-31'
    - release: Act! Premium v23, Act! Growth Suite v23
      supported_through: '2023-07-31'
      note: Act! Premium Cloud customers hosted by Act! on v23 were supported through 2023-12-31.
    - release: Act! Premium v22, Act! Growth Suite v22
      supported_through: '2022-03-31'
    - release: Act! Premium v21, Act! Growth Suite v21
      supported_through: '2021-11-30'
    - release: Act! Pro v21 and Act! Pro v22
      supported_through: '2021-11-30'
  api_compatibility_floor: >-
    Act! Web API is compatible with Act! Premium for Web v18 or greater
    (Web API Administrator's Guide, section 2).
  note: >-
    Act! does not emit RFC 8594 Sunset or Deprecation headers, and no operation
    in the 410-operation Swagger document is flagged deprecated:true. Retirement
    is announced by product release date on the obsolescence policy page, not in
    the API surface.

deprecated_operations_flagged: []
deprecated_operations_note: >-
  Checked all 31 refined specs (410 operations) for deprecated:true — none
  found. The provider Swagger document emits "deprecated": false on every
  operation. Act! does, however, encode deprecation in the operationId string
  itself, which no tool reads: eleven operations carry "Deprecated"/"Dep" in
  their generated operationId while still advertising deprecated:false. Those
  are listed below as a finding. Setting deprecated:true on them would be a
  one-line change in the source annotations and would make the signal
  machine-readable.
