description: >-
  Act! publishes per-user, per-month subscription pricing for the CRM product.
  It does NOT publish an API plan: there is no developer tier, no per-call
  pricing, no request quota on any tier, and no line item on the pricing page
  that names the Act! Web API. API access is an entitlement of the subscription
  — the Web API's own documented error codes make that explicit (4031
  "Subscription required", 4032 "API access permission required"), and the Web
  API Administrator's Guide describes Connections as "seamlessly connected with
  Act! as part of a Premium Subscription". The plans below are therefore the
  product plans a developer must buy to reach the API, not API plans.
