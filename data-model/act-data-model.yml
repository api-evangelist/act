  Swagger 2.0 document (https://apimta.act.com/act.web.api/swagger/docs/v1) —
  reading $ref links between models and id-reference fields. Relationship
  cardinality follows the schema: an array of Embedded<Entity> is has_many, a
  single <entity>ID string is belongs_to.
description: >-
  Act!'s object graph is a classic CRM core (Contact, Company, Group,
  Opportunity) with three activity-stream entities hung off it (Note, History,
  Activity/Task) and one distinguishing shape: the association entities are
  MANY-TO-MANY in both directions. A Note, a History record and an Opportunity
  each carry arrays of embedded companies, contacts, groups and opportunities —
  so "log this call against three contacts and their company" is one object, not
  four. Every top-level record also carries a recordManagerID, which is Act!'s
  row-level ownership and access-control field.
