access_control:
  field: recordManagerID
  note: >-
    Act! enforces record-level access. An operation can return 404 for a record
    that exists but is private to another user, so a missing record is not proof
    of absence.
  related_fields: [isPrivate]
  query_params_observed: [omitPrivate, includePrivate, showAll, showFor]

