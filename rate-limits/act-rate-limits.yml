description: >-
  Act! states that Act! Premium Cloud API requests are rate limited and names
  the three response headers a client should read. It does not publish a
  number: no request-per-minute figure, no per-plan quota, no burst allowance,
  and no status code for exhaustion. The runtime signal is therefore the only
  way to discover the limit — read X-RateLimit-Limit on the first response.
provider: Act! CRM
providerId: act
scope_note: >-
  Rate limiting is documented for Act! Premium Cloud (Act!-hosted). Self-hosted
  Act! Web API instances run on the customer's own IIS server; Act! publishes no
  limits for those, and any throttling there is whatever the customer's IIS
  configuration imposes.
