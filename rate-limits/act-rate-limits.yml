headers:
  X-RateLimit-Limit: The number of calls you can make a minute.
  X-RateLimit-Remaining: The number of calls you have left this minute.
  X-RateLimit-Reset: The next time the limit will be reset.
window: minute
responseCodes:
  throttled: null
  note: >-
    Act! documents no status code for a throttled request and no Retry-After
    header. The Swagger document declares no 429 on any of its 410 operations.
retry_guidance: >-
  Not published. Because X-RateLimit-Reset names the next reset instant, a
  client should back off until that instant rather than using a fixed delay.
