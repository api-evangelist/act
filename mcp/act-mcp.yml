blockers_for_a_real_mcp_server:
  - >-
    Act! Web API is deployed per-database on per-customer hosts
    (https://{server}/{customer}-api/act.web.api or a self-hosted IIS box), so a
    single hosted MCP endpoint cannot exist without a tenant-routing layer.
  - >-
    Authentication is HTTP Basic credentials exchanged for a JWT, with the
    target database named in a header. There is no OAuth authorization server,
    so there is no standard consent flow for an agent to obtain access.
  - >-
    The per-tenant schema is mutable (custom fields, custom entities), which
    means a fixed inputSchema would be wrong for most tenants; any real server
    would have to build tools from GET /api/metadata at connect time.
