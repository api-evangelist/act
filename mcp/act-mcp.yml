description: >-
  Act! operates no MCP server. This file is a CANDIDATE tool surface derived
  from the Act! Web API's own operations so the shape of an Act! MCP server can
  be reasoned about — it is not something Act! ships and no client can call it.
  The only MCP server that reaches Act! CRM today is third-party and read-only:
  CData's act-crm-mcp-server-by-cdata, which speaks to Act! over CData's own
  connector rather than the Web API.

