aid: act
name: Act! CRM
description: >-
  Act! is a CRM and marketing automation platform from Swiftpage built for
  small and mid-sized businesses, providing contact and activity management,
  opportunity tracking, email marketing, and pipeline reporting in cloud or
  on-premise editions. The Act! Web API is a JSON-based REST API that exposes
  contacts, companies, groups, opportunities, activities, notes, and history
  with OData query support and an OpenAPI (Swagger) 2.0 specification. The
  API supports both HTTP Basic Authentication and Bearer token authentication.
