    - https://www.act.com/trial/act/
  note: >-
    Documentation, the Swagger document and the anonymous GET /api/system route
    are all public and require no account. Actually calling the API requires an
    Act! subscription that includes API access — the API's own error codes 4031
    (Subscription required) and 4032 (API access permission required) make the
    entitlement explicit. Act! documents the free Act! Premium trial as the route
    to API access.
