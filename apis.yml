aid: act
name: Act! CRM
description: >-
  Act! is a CRM and marketing automation platform built for small and mid-sized
  businesses, providing contact and activity management, opportunity tracking,
  email marketing, and pipeline reporting in cloud (Act! Advantage) or
  on-premises (Act! Premium Desktop) editions. The Act! Web API is a JSON-based
  REST API that exposes contacts, companies, groups, opportunities, activities,
  tasks, notes, history, documents and tenant-defined custom entities across 410
  operations, with OData v4 query options ($filter, $orderby, $top, $skip,
  $select, $expand) on collection reads, multipart batching at POST /api/$batch,
  a webhook registration API, and a published Swagger 2.0 specification.
  Authentication is a JWT bearer token minted at GET /authorize from HTTP Basic
  credentials plus an Act-Database-Name header. The API is deployed per database
  — either on Act! Premium Cloud or on the customer's own IIS server — so the
  base URL is per-tenant.
type: Index
