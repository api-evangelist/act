apis:
- aid: act:web-api
  name: Act! Web API
  description: >-
    JSON-based REST API for the Act! CRM database exposing contacts, companies, groups, opportunities,
    tasks, activity series, calendar, notes, history, documents, attachments, users, teams, preferences,
    analytics and tenant-defined custom entities — 410 operations across 31 resource areas. Collection
    reads accept OData v4 query options; requests can be batched at POST /api/$batch; webhooks are registered
    through the API itself. The database schema is discoverable at runtime through the MetadataInfo operations
    because Act! databases are user-extensible. Authentication is a JWT bearer token obtained from GET
    /authorize with HTTP Basic credentials and an Act-Database-Name header.
