    decay_signal: >-
      The newest SDK offered is v23. Act!'s own obsolescence policy retired v23
      on 2026-07-31 (cloud customers 2023-12-31), and the current supported
      release is v26 — so the published SDK trails the supported product by
      three major versions. This is the strongest abandonment signal available
      for Act!'s developer surface, and it is provider-published.
    gate: >-
      Framed as an Act! Add-on Partner Program resource; the download page is
      public but the SDK targets the desktop object model, not the Web API.

