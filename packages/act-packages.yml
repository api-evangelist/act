  registry.npmjs.org, pypi.org, azuresearch-usnc.nuget.org (NuGet) and
  rubygems.org on 2026-08-13.
description: >-
  Act! publishes NO client library for the Act! Web API in any public package
  registry. There is no first-party SDK on npm, PyPI, NuGet, RubyGems,
  Packagist, Maven Central, crates.io or pkg.go.dev. What Act! does ship is a
  Windows .NET "Native SDK" — a versioned zip download behind a partner-program
  page, not a package — and one sample application on GitHub. Every registry
  package that mentions Act! CRM is third-party (CData's ADO.NET/EF Core
  connectors, a community NuGet client). Consumers of the Web API are expected
  to generate a client from the Swagger document or hand-roll HTTP.
official_sdk_in_registry: false
package_count: 0
