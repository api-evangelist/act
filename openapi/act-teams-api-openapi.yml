components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic credentials (Act! user name and password, RFC 7617) presented to GET /authorize
        together with the Act-Database-Name header to mint a JWT bearer token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer token returned by GET /authorize (RFC 6750). Sent as Authorization: Bearer
        <token> on every API request.'
    actDatabaseName:
      type: apiKey
      in: header
      name: Act-Database-Name
      description: Name of the Act! database the request is scoped to.
  schemas:
    System.Object:
      type: object
      properties: {}
    act.web.api.models.Teams.Team:
      description: ''
      type: object
      properties:
        id:
          description: ''
          type: string
        name:
          description: ''
          type: string
        description:
          description: ''
          type: string
        roster:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/act.web.api.models.Users.UserInfo'
    act.web.api.models.Users.UserInfo:
      description: ''
      type: object
      properties:
        id:
          description: ''
          type: string
        username:
          description: ''
          type: string
        role:
          description: ''
          type: string
        displayName:
          description: ''
          type: string
        email:
          description: ''
          type: string
        firstName:
          description: ''
          type: string
        lastLogOnDate:
          format: date-time
          description: ''
          type: string
        lastName:
          description: ''
          type: string
        status:
          description: ''
          type: string
