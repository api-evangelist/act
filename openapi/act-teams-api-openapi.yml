          text/xml:
            schema:
              $ref: '#/components/schemas/act.web.api.models.Teams.Team'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/act.web.api.models.Teams.Team'
        description: The team definition.
      responses:
        '200':
          description: OK indicates that the request succeeded and that the requested information is in
