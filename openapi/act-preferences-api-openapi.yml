      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/act.web.api.models.Users.Preference'
          application/xml:
            schema:
              $ref: '#/components/schemas/act.web.api.models.Users.Preference'
          text/xml:
            schema:
              $ref: '#/components/schemas/act.web.api.models.Users.Preference'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/act.web.api.models.Users.Preference'
        required: true
    delete:
      tags:
      - Preferences
      summary: Delete an existing user
      operationId: Preferences_DeletePreferences_DAC20CCD
      parameters:
      - name: id
        in: path
        description: The unique identifier (id) for a given user preference.
        required: true
        schema:
          type: string
      responses:
        '204':
