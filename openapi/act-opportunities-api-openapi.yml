components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic credentials (Act! user name and password, RFC 7617) presented to GET /authorize
        together with the Act-Database-Name header to mint a JWT bearer token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer token returned by GET /authorize (RFC 6750). Sent as Authorization: Bearer
        <token> on every API request.'
    actDatabaseName:
      type: apiKey
      in: header
      name: Act-Database-Name
      description: Name of the Act! database the request is scoped to.
  schemas:
    System.Object:
      type: object
      properties: {}
    act.web.api.models.Companies.EmbeddedCompany:
      description: A company entity that displayed as a sub-child to a parent entity.
      type: object
      properties:
        id:
          description: Gets a unique identifier (id) for a given company.
          type: string
        name:
          description: Gets the name of the company.
          type: string
    act.web.api.models.Contacts.AccessLevel:
      description: ''
      type: object
      properties:
        type:
          description: Defines the entity's access level.
          enum:
          - Public
          - Private
          - LimitedAccess
          type: string
        accessors:
          description: The accessors that have been selected for limited access.
          type: array
          items:
            $ref: '#/components/schemas/act.web.api.models.Users.Accessor'
    act.web.api.models.Contacts.EmbeddedContact:
      description: ''
      type: object
      properties:
        id:
          description: ''
          type: string
        displayName:
          description: ''
          type: string
          readOnly: true
        company:
          description: 'AS-1763 - API: Expose Opportunity Company name for use in Companion, removed [JsonIgnore]'
          type: string
        isInvited:
          description: Invited contact flag
          type: boolean
    act.web.api.models.Groups.EmbeddedGroup:
      description: An group entity that displayed as a sub-child to a parent entity.
      type: object
      properties:
        id:
          description: Gets a unique identifier (id) for a given group.
          type: string
        name:
          description: Gets the name of the group.
          type: string
    act.web.api.models.Opportunities.Opportunity:
      description: A contact or company which has been qualified.
      type: object
      properties:
        id:
          description: A unique identifier that represents a potential piece of business.
          type: string
        name:
          description: The name of an opportunity.
          type: string
        actualCloseDate:
          format: date-time
          description: The date that the opportunity as closed.
          type: string
        companies:
          description: List of companies that are associated to this opportunity entity.
          type: array
          items:
            $ref: '#/components/schemas/act.web.api.models.Companies.EmbeddedCompany'
        competitor:
          description: Gets the name of the competitor for this opportunity.
          type: string
        contactNames:
          description: The names of the contacts associated with this opportunity.
          type: string
        contacts:
          description: List of contacts that are associated to this opportunity entity.
          type: array
          items:
            $ref: '#/components/schemas/act.web.api.models.Contacts.EmbeddedContact'
        creator:
          description: The name of the creator of this opportunity.
          type: string
        daysOpen:
          format: int32
          description: The number of days this opportunity has been opened.
          type: integer
        daysInStage:
          format: int32
          description: the number of days this opportunity has been in a given stage.
          type: integer
        estimatedCloseDate:
          format: date-time
          description: The date the opportunity is expected to be closed.
          type: string
        stageStartDate:
          format: date-time
          description: The date the opportunity stage started.
          type: string
        grossMargin:
          format: double
          description: Represents the net sales less the cost of goods and services sold.
          type: number
        groups:
          description: List of groups that are associated to this opportunity entity.
          type: array
          items:
            $ref: '#/components/schemas/act.web.api.models.Groups.EmbeddedGroup'
        isPrivate:
          description: Indicates whether this opportunity is private
          type: boolean
        acl:
          description: Access Levels
          type: string
        openDate:
          format: date-time
          description: The date the opportunity was opened.
          type: string
        probability:
          format: int32
          description: The likelihood this opportunity will will be won by the close date.
          type: integer
        productTotal:
          format: double
          description: The total cost of the product or services.
          type: number
        product:
          description: Comma-delimited list of product names.
          type: string
        reason:
          description: Describes why the opportunity status changed.
          type: string
        source:
          description: Describes the source of the opportunity.
          type: string
        sourceId:
          description: The external source id for the opportunity
          type: string
        stage:
          $ref: '#/components/schemas/act.web.api.models.Opportunities.Stage'
          description: The stage of the opportunity.
        status:
          description: This gets/sets the opportunity status (0 = Open, 1 = Won, 2 = Lost, or 3 = inactive).
          enum:
          - Open
          - Won
          - Lost
          - Inactive
          type: string
        statusName:
          description: This displays the opportunity status name (Open, Won, Lost, or inactive).
          type: string
          readOnly: true
        importDate:
          format: date-time
          description: This readonly property displays the date that the opportunity was imported into
            the system.
          type: string
        totalPerCompany:
          format: double
          description: The average total per associated company.
          type: number
        totalPerContact:
          format: double
          description: The average total per associated contact.
          type: number
        totalPerGroup:
          format: double
          description: The average total per associated group.
          type: number
        weightedTotal:
          format: double
          description: The weight of the product.
          type: number
        quickbooksInvoiceId:
          description: Quickbooks external Id to match record with quickbooks contact
          type: string
        relatedEntitiesResolver:
          description: 'If true: prevents related entities from serializing.'
          type: boolean
        recordManagerID:
          description: The record manager.
          type: string
        customFields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/System.Object'
        created:
          format: date-time
          type: string
        edited:
          format: date-time
          type: string
        editedBy:
          type: string
        recordManager:
          type: string
    act.web.api.models.Opportunities.OpportunityListRequest:
      description: Assign opportunities request model.
      type: object
      properties:
        opportunities:
          description: List of opportunity identifiers.
          type: array
          items:
            type: string
    act.web.api.models.Opportunities.OpportunityProduct:
      description: This class describes a particular product that is associated with an opportunity.
      type: object
      properties:
        id:
          description: A unique identifier (id) for a given opportunity product.
