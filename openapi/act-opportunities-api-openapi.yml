            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/act.web.api.models.Opportunities.Opportunity'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/act.web.api.models.Opportunities.Opportunity'
        '400':
          description: BadRequest indicates that the request could not be understood by the server. BadRequest
            is sent when no other error is applicable, or if the exact error is unknown or does not have
            its own error code.
        '401':
          description: Unauthorized indicates that the requested resource requires authentication. The
            WWW-Authenticate header contains the details of how to perform the authentication.
        '404':
          description: NotFound indicates that the requested resource does not exist on the server.
        '500':
          description: Unexpected error.
    delete:
      tags:
      - Opportunities
      summary: Dissociate an opportunity from a specific company.
      operationId: Opportunities_DeleteAssociatedOpportunitiesFromCompany_DBEAE28F
      parameters:
      - name: companyId
        in: path
        required: true
        description: The unique identifier (id) for a given company.
        schema:
