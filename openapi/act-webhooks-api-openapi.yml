  /api/webhooks:
    get:
      tags:
      - Webhooks
      summary: Get all webhooks matching an (optional) OData query.
      operationId: Webhooks_Get_3F017BC6
      responses:
        '200':
          description: OK indicates that the request succeeded and that the requested information is in
