  /api/webhooks/{id}/suspend:
    put:
      tags:
      - Webhooks
      summary: Suspend webhook.
      operationId: Webhooks_Suspend_A12B132D
      parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier (id) for a given webhook.
        schema:
          type: string
