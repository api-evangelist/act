          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/act.web.api.models.WebHooks.RegistrationViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/act.web.api.models.WebHooks.RegistrationViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/act.web.api.models.WebHooks.RegistrationViewModel'
        '401':
          description: Unauthorized indicates that the requested resource requires authentication. The
