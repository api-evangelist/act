    patch:
      tags:
      - Webhooks
      summary: Update (Partial) an already existing webhook.
      operationId: Webhooks_Patch_B8C243E8
      parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier (id) for a given webhook.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
        description: Webhook callback registration.
      responses:
