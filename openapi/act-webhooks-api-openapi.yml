components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic credentials (Act! user name and password, RFC 7617) presented to GET /authorize
        together with the Act-Database-Name header to mint a JWT bearer token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer token returned by GET /authorize (RFC 6750). Sent as Authorization: Bearer
        <token> on every API request.'
    actDatabaseName:
      type: apiKey
      in: header
      name: Act-Database-Name
      description: Name of the Act! database the request is scoped to.
  schemas:
    System.Object:
      type: object
      properties: {}
    act.web.api.models.WebHooks.RegistrationViewModel:
      description: Provides information about the registered webhook.
      type: object
      properties:
        id:
          description: The unique identifier (id) for this webhook.
          type: string
        name:
          description: Gets the name of the webhook.
          type: string
          readOnly: true
        monitor:
          description: The entity that the webhook will monitor and raise events for.
          enum:
          - Activities
          - Companies
          - Contacts
          - Fields
          - Groups
          - History
          - Opportunities
          - Products
          - Custom
          type: string
        triggerEvent:
          description: The action that will trigger the webhook.
          enum:
          - Alarms
          - Created
          - Updated
          type: string
        monitorName:
          description: The entity name that the webhook will monitor and raise events for.
          type: string
        queryOption:
          description: This defines a composite OData query options that can be used to perform query
            composition. Currently this only supports $filter, $orderby, $top, $skip, and $count
          type: string
        userId:
          description: The unique identifier (id) for the user that this webhooks is registered.
          type: string
        username:
          description: The username that this webhook will broadcast triggered events.
          type: string
        database:
          description: The database name where the webhook is monitoring for activity.
          type: string
        server:
          description: The database server name where the webhook is monitoring for activity.
          type: string
        authority:
          description: The address of the authentication server issuing the token.
          type: string
        resourceUrl:
          description: The resource URL that the webhook will monitor.
          type: string
        callbackUrl:
          description: The callback url that the webhook will send the response.
          type: string
        callbackId:
          description: Client defined unique identifier (id) for this webhook.
          type: string
        created:
          format: date-time
          description: The date that the webhook was created.
          type: string
        edited:
          format: date-time
          description: The date that the webhook was modified.
          type: string
        suspended:
          format: date-time
          description: The date that the webhook was suspended.
          type: string
        failedAttempts:
          format: int32
          description: The number of failed attempts that has occured.
          type: integer
        failedRestarts:
          format: int32
          description: The number of failed restarts that have occured after registration has been suspended.
          type: integer
        lastNotificationSent:
          format: date-time
          description: The date of the last notification sent.
          type: string
        description:
          description: A brief description of why this webhook is being created.
          type: string
    act.web.api.models.WebHooks.WebhookRequest:
      description: WebhookRequest URL parameters
      type: object
      properties:
        monitor:
          description: The entity the webhook will monitor.
          enum:
          - Activities
          - Companies
          - Contacts
          - Fields
          - Groups
          - History
          - Opportunities
          - Products
          - Custom
          type: string
        triggerEvent:
          description: WebhookRequest action on the monitored table.
          enum:
          - Alarms
          - Created
          - Updated
          type: string
        monitorName:
          description: The entity name the webhook will monitor (only need to set for custom tables.
          type: string
        queryOption:
          description: This defines a composite OData query options that can be used to perform query
            composition. Currently this only supports $filter, $orderby, $top, $skip, and $count
          type: string
        callbackUrl:
          description: The callback url that the webhook will send the response.
          type: string
        callbackId:
          description: Client defined unique identifier (id) for this webhook.
          type: string
        callbackToken:
          description: The callback client secret.
          type: string
        certHashString:
          description: The SHA1 hash value for the X.509v3 certificate as a hexadecimal string to verify
            https calls to callback URL.
          type: string
        description:
          description: A brief description of why this webhook is being created.
          type: string
