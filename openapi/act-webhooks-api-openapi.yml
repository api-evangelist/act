      summary: Update a webhook.
      operationId: Webhooks_Put_20B03A3C
      parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier (id) for a given webhook.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/act.web.api.models.WebHooks.WebhookRequest'
        description: Webhook callback registration.
      responses:
        '200':
          description: OK indicates that the request succeeded and that the requested information is in
