                $ref: '#/components/schemas/act.web.api.models.Users.UserInfo'
            text/xml:
              schema:
                $ref: '#/components/schemas/act.web.api.models.Users.UserInfo'
        '400':
          description: BadRequest indicates that the request could not be understood by the server. BadRequest
            is sent when no other error is applicable, or if the exact error is unknown or does not have
            its own error code.
        '401':
          description: Unauthorized indicates that the requested resource requires authentication. The
            WWW-Authenticate header contains the details of how to perform the authentication.
        '404':
          description: NotFound indicates that the requested resource does not exist on the server.
        '500':
          description: Unexpected error.
    delete:
      tags:
      - Users
      summary: Delete an existing user.
      operationId: Users_Delete_3C7F08ED
      parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier (id) for a given user.
        schema:
          type: string
      - name: reassignTo
        in: query
        required: false
        description: The unique identifier (id) for the user to reassign records to.  If null, all records
          for this user will be deleted.
        schema:
          type: string
      - name: removeContact
        in: query
        required: false
        description: If true, the contact for this user will also be removed.
        schema:
          type: boolean
      responses:
        '204':
          description: NoContent indicates that the request has been successfully processed and that the
            response is intentionally blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System.Object'
            application/xml:
              schema:
                $ref: '#/components/schemas/System.Object'
            text/xml:
              schema:
                $ref: '#/components/schemas/System.Object'
        '400':
          description: BadRequest indicates that the request could not be understood by the server. BadRequest
            is sent when no other error is applicable, or if the exact error is unknown or does not have
