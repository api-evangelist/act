components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic credentials (Act! user name and password, RFC 7617) presented to GET /authorize
        together with the Act-Database-Name header to mint a JWT bearer token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer token returned by GET /authorize (RFC 6750). Sent as Authorization: Bearer
        <token> on every API request.'
    actDatabaseName:
      type: apiKey
      in: header
      name: Act-Database-Name
      description: Name of the Act! database the request is scoped to.
  schemas:
    System.Object:
      type: object
      properties: {}
    act.web.api.models.Configuration.ConfigurationDefinition:
      description: This class defines a generic view definitions.
      type: object
      properties:
        userId:
          description: The unique identifier (id) for the user.
          type: string
        definition:
          description: The configuration schema definitions file (XML|Json)
          type: string
    act.web.api.models.Configuration.ConfigurationSettings:
      description: This class defines a generic view settings.
      type: object
      properties:
        userId:
          description: The unique identifier (id) the user.
          type: string
        settingsDefinition:
          description: The configuration schema definitions file (XML|Json)
          type: string
    act.web.api.models.Users.Accessor:
      description: The user/team that is granted access.
      type: object
      properties:
        id:
          description: Unique identifier for the accessor/user id
          type: string
        type:
          description: The type of accessor (User = 1 or Team = 2)
          enum:
          - Unknown
          - User
          - Team
          - Resource
