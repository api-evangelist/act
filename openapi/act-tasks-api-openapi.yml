    get:
      tags:
      - Tasks
      summary: Get all recurring tasks matching an (optional) OData query.
      operationId: Tasks_GetRecurringTasks_662BB41B
      parameters:
      - name: format
        in: query
        required: false
        description: Specifics different formats that the API can convert the details ((RichText (Default),
          PlainText, and HyperText).
        schema:
          type: string
          enum:
          - auto
          - rtf
          - text
          - html
      - name: restriction
        in: query
        required: false
        description: 'Controls how each recurring series is represented: All (every occurrence), FirstOccurrence
          (the first occurrence of each series - the default), or FirstUnclearedOccurrence (the first
          uncleared occurrence). Defaults to FirstOccurrence.'
        schema:
          type: string
          enum:
          - All
          - FirstOccurrence
          - FirstUnclearedOccurrence
      - name: filterBy
        in: query
        required: false
        description: 'Controls how a startTime filter is interpreted: InRange (the default - the filter
          selects occurrences in the range, so a series spanning several ranges is returned once per range)
          or InSeries (the filter is applied to the first occurrence of the whole series, so each series
          is returned only from the range containing its first occurrence). InSeries requires a startTime
          filter and cannot be combined with restriction=FirstUnclearedOccurrence.'
        schema:
          type: string
          enum:
          - InRange
          - InSeries
      responses:
        '200':
          description: OK indicates that the request succeeded and that the requested information is in
            the response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/act.web.api.models.Activities.ActivitySeries'
            application/xml:
