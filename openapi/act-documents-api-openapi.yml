      summary: Delete an existing history document.
      operationId: Documents_Delete_279427F5
      parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier (id) for a given history document.
        schema:
          type: string
      responses:
        '204':
          description: NoContent indicates that the request has been successfully processed and that the
