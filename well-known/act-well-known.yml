generated: '2026-08-13'
method: probed
source: >-
  Live probes of the /.well-known/ discovery surface on every host named in
  apis.yml (baseURL, humanURL, Website) and in the refined OpenAPI servers[]
  (https://apimta.act.com/act.web.api). Status is the HTTP code observed at
  fetch time on 2026-08-13.
description: >-
  Act! serves no /.well-known/ discovery documents on any of its hosts. Every
  path probed returned 404. www.act.com and developer.act.com are one WordPress
  site that renders a themed HTML 404 body with the 404 status code — the status
  is honest, the body is just the site's 404 page. apimta.act.com is an IIS
  application that returns the stock ASP.NET 404. No WellKnown or SecurityTxt
  pointer is emitted in apis.yml, because nothing was served.
hosts:
  - host: https://www.act.com
    documents:
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/openid-configuration
        status: 404
