saved_documents: []
findings:
  - >-
    No security.txt is served, even though Act! publishes a full Vulnerability
    Disclosure Policy at
    https://www.act.com/act-and-security/vulnerability-disclosure-policy/ with a
    reporting address of vulnerabilityreport@act.com. Publishing
    /.well-known/security.txt (RFC 9116) pointing at that policy would be a
    single-file fix — see security/act-vulnerability-disclosure.yml.
  - >-
    No OAuth/OIDC discovery documents. Act! Web API does not use OAuth 2.0; it
    mints a JWT from HTTP Basic credentials at GET /authorize — see
    authentication/act-authentication.yml.
